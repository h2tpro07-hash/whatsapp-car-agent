# Déploiement en un clic sur Render (https://render.com)
# Dashboard > New > Blueprint > sélectionner ce repo.
# Les variables marquées `sync: false` sont à saisir dans l'UI Render au déploiement.
services:
  - type: web
    name: whatsapp-car-agent
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Render n'a pas de sortie IPv6 : force la résolution IPv4 (sinon `fetch failed`).
      - key: NODE_OPTIONS
        value: --dns-result-order=ipv4first
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      # Clé anon/publishable Supabase : prévue pour être publique, utilisée par le
      # navigateur (page /admin) pour l'authentification (Supabase Auth).
      - key: SUPABASE_ANON_KEY
        sync: false
      # UUID du garage servi par ce déploiement (voir sql/schema.sql ou
      # sql/migrate_v2_multi_tenant.sql, qui l'affichent en NOTICE après exécution).
      - key: DEFAULT_GARAGE_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: REPLY_MODE
        value: twiml
      - key: VALIDATE_TWILIO_SIGNATURE
        value: "false"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
